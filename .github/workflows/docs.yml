name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,models]"

      - name: Generate documentation
        # Also mirrors the root-level documents into docs/ and asserts that
        # every relative link resolves inside the docs tree. Exits non-zero on
        # a broken link, so this fails before mkdocs is even reached.
        run: python scripts/generate_docs.py

      - name: Fail if generated docs are stale
        # Documentation is derived from the code, and the mirrored copies of
        # CHANGELOG/CONTRIBUTING/SECURITY/branch-protection are derived from
        # their sources. If regenerating changes anything, what is committed no
        # longer matches what the repository actually says.
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::Generated docs are out of date. Run scripts/generate_docs.py and commit."
            git diff --stat -- docs/
            exit 1
          fi
          echo "Generated documentation is current."

      - name: Build site
        # Strict mode stays on: a link that escapes docs/ is broken on the
        # published site even though it resolves when browsing GitHub.
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
