name: Feature request
description: Propose a change or addition
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today. Not a proposed solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - "1-3 infrastructure / settlement / discovery"
        - "4-5 data collection"
        - "6 feature engineering"
        - "7 model training"
        - "8 backtesting"
        - "9 paper trading"
        - "10 live execution"
        - "11-12 monitoring / retraining"
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes a feature definition (feature schema version will move)
        - label: Changes stored data shape (dataset schema version must move)
        - label: Touches a safety gate (settlement, leakage, readiness, promotion)
        - label: None of the above
