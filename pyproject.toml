[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmbtc"
version = "0.11.0"
description = "Autonomous, self-learning trading bot for Polymarket Bitcoin 5-minute Up/Down markets"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }

# Module 1 pins only what the foundation needs. Each later module appends its own
# extra, so `pip install -e .` on a fresh box stays fast and always importable.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "orjson>=3.10",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Module 2+: data collection / venue clients
data = [
    "httpx>=0.27,<1",
    "websockets>=12.0",
    "tenacity>=8.3",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
]
# Module 7 core modelling. Deliberately light: everything CI needs to run the
# baselines, calibration, selection, and training framework, with no deep
# learning stack. `ml` below adds torch and the boosted-tree zoo (~3 GB), which
# is far too heavy for a per-push CI job.
models = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
# Optional but strongly recommended alongside `models`: real SHAP attribution
# rather than the permutation fallback.
explain = [
    "shap>=0.45",
]
# Full modelling stack for local research.
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "torch>=2.3",
    "pytorch-tabnet>=4.1",
    "optuna>=3.6",
]
# Module 9+: execution against Polymarket
trade = [
    "py-clob-client>=0.17",
    "web3>=6.19",
    "eth-account>=0.12",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
pmbtc = "pmbtc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "network: test performs real network I/O (deselected by default in CI)",
    "slow: long-running test (training, backtests)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
# 3.12: numpy's bundled stubs use `type` statements, which are a syntax error
# for mypy when it targets 3.11.
python_version = "3.12"
packages = ["pmbtc"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
